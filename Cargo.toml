[package]
name = "spot-tui"
version = "0.1.0"
edition = "2024"
description = "A terminal Spotify client with synced, word-by-word lyrics"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[dependencies]
chrono = "0.4.45"
crossterm = "0.29.0"
directories = "6.0.0"
env_logger = "0.11.11"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
librespot-connect = "0.8.0"
librespot-core = "0.8.0"
librespot-metadata = "0.8.0"
librespot-oauth = "0.8.0"
librespot-playback = "0.8.0"
# Japanese romanization. The embedded IPADIC dictionary adds ~49 MB to the
# release binary (about 22 -> 59 MB with the stripped release profile), and the
# first build downloads it from Lindera.dev (md5-pinned by lindera-ipadic), so
# that build needs network access.
lindera = { version = "6", features = ["embed-ipadic"] }
log = "0.4.34"
pinyin = "0.11"
ratatui = "0.30.2"
ratatui-image = { version = "11.0.8", default-features = false, features = ["crossterm"] }
rspotify = "0.16.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.10"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
toml = "1.1.5"
unicode-normalization = "0.1"
ureq = { version = "2", features = ["json"] }
wana_kana = "5"

# Dependency patches; see docs/VENDORING.md for the why and for how to re-apply
# the vendored changes on a librespot upgrade.
#
# `cargo add` / `cargo remove` do not reliably preserve this section: re-add it
# if it goes missing after editing dependencies.
[patch.crates-io]
vergen-gitcl = { git = "https://github.com/rustyhorde/vergen", tag = "vergen_gitcl_1.0.3" }
librespot-core = { path = "vendor/librespot-core" }
librespot-connect = { path = "vendor/librespot-connect" }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
