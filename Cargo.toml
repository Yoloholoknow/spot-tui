[package]
name = "spot-tui"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
crossterm = "0.29.0"
directories = "6.0.0"
env_logger = "0.11.11"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
librespot-connect = "0.8.0"
librespot-core = "0.8.0"
librespot-metadata = "0.8.0"
librespot-oauth = "0.8.0"
librespot-playback = "0.8.0"
# Japanese romanization (Phase 23): lindera with the IPADIC dictionary embedded.
# Costs ~49 MB of release binary (22 -> 72 MB), and the first build downloads the
# dictionary tarball from Lindera.dev (md5-pinned by lindera-ipadic's build
# script), so that build needs network access to that host.
lindera = { version = "6", features = ["embed-ipadic"] }
log = "0.4.34"
pinyin = "0.11"
ratatui = "0.30.2"
ratatui-image = { version = "11.0.8", default-features = false, features = ["crossterm"] }
rspotify = "0.16.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.10"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
toml = "1.1.5"
unicode-normalization = "0.1"
ureq = { version = "2", features = ["json"] }
wana_kana = "5"

# librespot-core declares `vergen-gitcl = "1.0"` (a loose range), and the
# newest version satisfying that today, 1.0.8, has a self-inconsistent
# manifest (depends on both vergen-lib 0.1.6 directly AND vergen-lib 9.1.0
# transitively via `vergen`) -- confirmed upstream bug,
# github.com/librespot-org/librespot/issues/1681. Pinned back to the last
# version published before that inconsistency, via its git tag (no
# matching version exists on crates.io to pin directly). NOTE: `cargo add`
# / `cargo remove` do not reliably preserve this section -- re-add it if
# it goes missing after editing dependencies.
[patch.crates-io]
vergen-gitcl = { git = "https://github.com/rustyhorde/vergen", tag = "vergen_gitcl_1.0.3" }

# Smart shuffle (Phase 25): `SetOptionsCommand` drops the `modes` map the
# official app sends with `set_options` (smart shuffle is
# `modes.context_enhancement = "RECOMMENDATION"`), so librespot reverted it
# to plain shuffle. These two vendored copies of 0.8.0 differ from stock in
# exactly these places -- re-apply them on any librespot upgrade:
#   librespot-core    dealer/protocol/request.rs   `modes` field on SetOptionsCommand
#                     authentication.rs            `#[expect(deprecated)]` -> `#[allow(...)]` (silences a
#                                                  lint that only warns because it is a path crate)
#   librespot-connect state/options.rs             set_modes, set_smart_shuffle_mode,
#                                                  smart_shuffle_active() flag, shuffle-off
#                                                  resets the mode (+ tests)
#                     state.rs                     re-export of smart_shuffle_active
#                     state/transfer.rs            publish the flag after a transfer
#                     spirc.rs                     `modes` in the SetOptions arm,
#                                                  Spirc::smart_shuffle(), and re-announcing
#                                                  shuffle/repeat after a transfer applies its
#                                                  options (stock announces the stale pre-transfer
#                                                  values, so a launch always showed shuffle off)
librespot-core = { path = "vendor/librespot-core" }
librespot-connect = { path = "vendor/librespot-connect" }
