    ["Ctrl+↓", "add a search result to a playlist, without leaving Search"],
  ]],
  ["Move mode", [["↑ / ↓", "relocate, locally, no network call per keystroke"], ["g", "jump straight to a position, instead of one slot at a time"], ["Enter", "confirm -- one reorder call"], ["Esc", "cancel -- walks back to the start"]]],
  ["Overlays", [
    ["Enter", "prompt: submit · picker/quick jump: activate · confirm: same as y"],
    ["y / n", "confirm / cancel"], ["Esc", "cancel, no exceptions"],
    ["any key", "picker & quick jump: narrows the list live, no / needed"],
  ]],
];

function renderHelp() {
  const mid = Math.ceil(HELP_SECTIONS.length / 2);
  const col = (sections) => sections.map(([title, rows]) => `<div class="help-section">
      <div class="help-section-title">${esc(title)}</div>
      ${rows.map(([k, d]) => `<div class="help-row"><span class="help-key">${esc(k)}</span><span class="help-desc">${esc(d)}</span></div>`).join("")}
    </div>`).join("");
  return screenHeader("Keybinds") + ruleLine() +
    `<div class="help-columns"><div class="help-col">${col(HELP_SECTIONS.slice(0, mid))}</div><div class="help-col">${col(HELP_SECTIONS.slice(mid))}</div></div>`;
}

// 6 static entries -- Help is deliberately NOT one of them, reachable
// only via `?` -- plus a live, pinned-first view of the user's
// playlists. No "+ new playlist" row here: the real Sidebar has no `c`
// binding of its own (confirmed by reading the source directly rather
// than assumed) -- creating a playlist requires Your Playlists.
function sidebarEntries() {
  const entries = [
    {type:"menu", label:"Now Playing", icon:"▶", screen:"nowplaying"},
    {type:"menu", label:"Search", icon:"/", screen:"search"},
    {type:"menu", label:"Library", icon:"☰", screen:"library"},
    {type:"menu", label:"Liked Songs", icon:"♥", screen:"likedSongs"},
    {type:"menu", label:"Queue", icon:"≡", screen:"queue"},
    {type:"menu", label:"Devices", icon:"◧", screen:"devices"},
    {type:"divider"},
    {type:"section", label:"PLAYLISTS"},
  ];
  const pairs = pinnedFirst(PLAYLISTS.map((p, i) => [i, p]), pins.playlists, p => p.uri);
  pairs.forEach(([, p]) => entries.push({type:"playlist", label:p.name, playlist:p}));
  return entries;
}

function openScreenFromSidebar(screen) {
  goto(screen);
  if (screen === "search") { search = { query: "", cursor: 0, results: [], searching: false }; }
  if (screen === "devices") ensureFetched("devices");
}

function activateSidebarEntry(e) {
  if (!e) return;
  if (e.type === "menu") openScreenFromSidebar(e.screen);
  else if (e.type === "playlist") goto("playlistDetail", {playlist: e.playlist});
  focus = "main";
  render();
}

function renderSidebar() {
  const entries = sidebarEntries();
  const rootScreen = stack.length === 1 ? stack[0] : (stack.length === 2 ? stack[1] : null);
  let html = "";
  let selIdx = 0;
  entries.forEach(e => {
    if (e.type === "divider") { html += `<div class="sb-divider"></div>`; return; }
    if (e.type === "section") { html += `<div class="sb-section">${esc(e.label)}</div>`; return; }
    const isSel = focus === "sidebar" && selIdx === sidebarSel;
    let isOpen = false;
    if (rootScreen) {
      if (e.type === "menu" && rootScreen.screen === e.screen) isOpen = true;
      if (e.type === "playlist" && rootScreen.screen === "playlistDetail" && rootScreen.playlist === e.playlist) isOpen = true;
    }
    const pinMarker = e.type === "playlist" && pins.playlists.has(e.playlist.uri) ? `<span class="pin">★</span>` : "";
    html += `<div class="sb-item${isSel ? " sel" : ""}${isOpen ? " open" : ""}" data-i="${selIdx}">` +
            `<span class="ic">${e.icon || ""}</span><span class="name">${esc(e.label)}</span>${pinMarker}</div>`;
    selIdx++;
  });
  document.getElementById("sidebar").innerHTML = html;
}

function renderPlaybar() {
  const tr = nowPlaying.track;
  if (!tr) { document.getElementById("playbar").innerHTML = `<div class="dim">nothing playing</div>`; return; }
  const icon = nowPlaying.playing ? "▶" : "⏸";
  const mm = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
  const filled = Math.round((nowPlaying.pos / nowPlaying.dur) * 24);
  const gauge = `<span class="gauge-fill">${"█".repeat(filled)}</span><span class="gauge-empty">${"░".repeat(24-filled)}</span>`;
  document.getElementById("playbar").innerHTML = `
    <div class="pb-art" style="${artStyle(tr)}">${esc(monogram(tr))}</div>
    <div class="pb-info">
      <div class="pb-title">${esc(tr.title)}</div>
      <div class="pb-artist">${esc(tr.artist)}</div>
    </div>
    <div class="pb-controls">
      <span class="pb-btn" data-act="prev">⏮</span>
      <span class="pb-btn" data-act="playpause">${icon}</span>
      <span class="pb-btn" data-act="next">⏭</span>
    </div>
    <div class="pb-gauge">${mm(nowPlaying.pos)} ${gauge} ${mm(nowPlaying.dur)}</div>
    <div class="pb-toggles">
      <span class="pb-btn${shuffle ? " accent" : ""}" data-act="shuffle" title="shuffle (s)">S</span>
      <span class="pb-btn${repeat ? " accent" : ""}" data-act="repeat" title="repeat (R)">R</span>
    </div>
    <div class="pb-vol">vol ${nowPlaying.vol}%</div>
  `;
}

function doNext() {
  if (!QUEUE.length) return;
  queueIndex = Math.min(QUEUE.length - 1, queueIndex + 1);
  nowPlaying.track = QUEUE[queueIndex]; nowPlaying.pos = 0; nowPlaying.playing = true; nowPlaying.contextLabel = "Queue"; render();
}
function doPrev() {
  if (!QUEUE.length) return;
  queueIndex = Math.max(0, queueIndex - 1);
  nowPlaying.track = QUEUE[queueIndex]; nowPlaying.pos = 0; nowPlaying.playing = true; nowPlaying.contextLabel = "Queue"; render();
}
function togglePlay() { nowPlaying.playing = !nowPlaying.playing; render(); }
function toggleShuffle() { shuffle = !shuffle; render(); }
function toggleRepeat() { repeat = !repeat; render(); }
function setStatus(text, isErr) { status = { text, kind: isErr ? "err" : "ok" }; }

// The three overlays render here, on top of whatever screen is showing
// underneath -- not a screen-stack replacement, so the context you were
// acting on (the playlist, the track) stays visible in place. Severity
// (danger/warn/neutral) sets the border+text color so the risk level
// reads before the words do.
function quickJumpEntries() {
  const entries = [];
  [["Now Playing", "▶", "nowplaying"], ["Search", "/", "search"], ["Library", "☰", "library"],
   ["Liked Songs", "♥", "likedSongs"], ["Queue", "≡", "queue"], ["Devices", "◧", "devices"], ["Help", "?", "help"]]
    .forEach(([label, icon, screen]) => entries.push({ kind: "screen", label, icon, screen }));
  PLAYLISTS.forEach(p => entries.push({ kind: "playlist", label: p.name, meta: `playlist · ${p.tracks.length} tracks`, playlist: p }));
  ARTISTS.forEach(a => entries.push({ kind: "artist", label: a.name, meta: "artist", artist: a }));
  ALBUMS.forEach(a => entries.push({ kind: "album", label: a.name, meta: `album · ${a.artist}`, album: a }));
  LIKED_SONGS.forEach(t => entries.push({ kind: "track", label: `${t.artist} — ${t.title}`, meta: "liked song", track: t }));
  DEVICES.forEach(d => entries.push({ kind: "device", label: d.name, meta: d.active ? "device · active" : "device", device: d }));
  return entries;
}
function quickJumpMatches() {
  const q = quickJump.query.toLowerCase();
  const all = quickJumpEntries();
  return (q ? all.filter(e => e.label.toLowerCase().includes(q)) : all).slice(0, 12);
}
// Each kind activates the way it already does from its own home screen
// -- playlist/artist/album open their detail (pure nav), a track plays
// immediately, a device transfers immediately. No new convention
// invented, just the existing per-kind "Enter" behavior reached from
// anywhere instead of only from that entity's own list.
function activateQuickJump(entry) {
  quickJump = null;
  if (!entry) { render(); return; }
  if (entry.kind === "screen") openScreenFromSidebar(entry.screen);
  else if (entry.kind === "playlist") push("playlistDetail", { playlist: entry.playlist });
  else if (entry.kind === "artist") push("artistDetail", { artist: entry.artist });
  else if (entry.kind === "album") push("albumDetail", { album: entry.album });
  else if (entry.kind === "track") { nowPlaying.track = entry.track; nowPlaying.playing = true; nowPlaying.pos = 0; nowPlaying.contextLabel = "Liked Songs"; goto("nowplaying"); }
  else if (entry.kind === "device") { DEVICES.forEach(d => d.active = (d.id === entry.device.id)); setStatus("transferred playback"); }
  focus = "main";
  render();
}

function renderOverlay() {
  const existing = document.getElementById("overlay");
  if (existing) existing.remove();
  let inner = null;
  if (quickJump) {
    const matches = quickJumpMatches();
    const iconFor = { screen: "→", playlist: "☰", artist: "♪", album: "◆", track: "♫", device: "◧" };
    const list = matches.length
      ? matches.map((e, i) => row(i, iconFor[e.kind] || "", e.label, e.meta || "", i === quickJump.selected)).join("")
      : `<div class="hint">no matches</div>`;
    inner = `<div class="picker-box">
      <div class="picker-title">Quick jump -- any playlist, track, artist, album, or device</div>
      <div class="picker-filter">/ ${esc(quickJump.query)}<span class="cursor">&nbsp;</span></div>
      <div class="picker-list">${list}</div>
    </div>`;
  } else if (confirmOverlay) {
    const sev = confirmOverlay.severity;
    inner = `<div class="modal-box sev-${sev}">
      <div class="modal-msg sev-${sev}">${esc(confirmOverlay.message)}</div>
      <div class="modal-hint"><span class="modal-btn" data-act="confirm-yes">y / Enter = confirm</span> &nbsp;&nbsp; <span class="modal-btn" data-act="confirm-no">n / Esc = cancel</span></div>
    </div>`;
  } else if (textPrompt) {
    const before = esc(textPrompt.buf.slice(0, textPrompt.cursor));
    const after = esc(textPrompt.buf.slice(textPrompt.cursor));
    inner = `<div class="modal-box sev-neutral">
      <div class="modal-title">${esc(textPrompt.title)}</div>
      <div class="prompt-input">${before}<span class="cursor">&nbsp;</span>${after}</div>
    </div>`;
  } else if (picker) {
    const label = p => p.name;
    const pairs = pinnedFirst(filteredSorted(PLAYLISTS, picker.filter, label), pins.playlists, p => p.uri);
    let list;
    if (PLAYLISTS.length === 0) list = `<div class="hint">no playlists yet -- press c to create one from Your Playlists</div>`;
    else if (pairs.length === 0) list = `<div class="hint">no matches</div>`;
    else list = pairs.map(([, p], i) => row(i, pins.playlists.has(p.uri) ? "★" : "", p.name, `${p.tracks.length} tracks`, i === picker.selected)).join("");
    inner = `<div class="picker-box">
      <div class="picker-title">Add “${esc(picker.trackLabel)}” to…</div>
      <div class="picker-filter">/ ${esc(picker.filter.query)}<span class="cursor">&nbsp;</span></div>
      <div class="picker-list">${list}</div>
    </div>`;
  }
  if (!inner) return;
  const div = document.createElement("div");
  div.id = "overlay";
  div.className = "modal-overlay";
  div.innerHTML = inner;
  document.getElementById("shell").appendChild(div);
  // Real mouse parity for overlays -- the banner claims "keyboard AND
  // mouse both work here" but every overlay was keyboard-only until
  // now: clicking a picker/quick-jump row activated nothing, clicking
  // confirm's y/n text did nothing, and there was no click-outside-to-
  // dismiss. `#overlay` is fully recreated every render, so binding
  // fresh listeners here each time is safe (no leak to clean up).
  div.addEventListener("click", (e) => {
    if (e.target === div) { confirmOverlay = null; textPrompt = null; picker = null; quickJump = null; render(); return; }
    const btn = e.target.closest("[data-act]");
    if (btn && confirmOverlay) { btn.dataset.act === "confirm-yes" ? fireConfirm() : (confirmOverlay = null); render(); return; }
    const rowEl = e.target.closest("[data-i]");
    if (!rowEl) return;
    const i = parseInt(rowEl.dataset.i, 10);
    if (picker) { picker.selected = i; confirmAddToPicker(); }
    else if (quickJump) { activateQuickJump(quickJumpMatches()[i]); }
  });
}

/* ---------- input handling ---------- */

// No more "never show truly empty" fallback -- that hack existed only
// because there was no designed empty-results state yet. There is now,
// so a query that genuinely matches nothing shows exactly that, which
// matters: a real, previously-live-reported failure class (Dev Mode's
// "Invalid limit" 400s) looks exactly like this from the UI's side, and
// it deserves the same design scrutiny as the happy path.
function doSearch(q) {
  const words = q.toLowerCase();
  search.results = Object.values(TRACKS).filter(t =>
    (t.title + " " + t.artist).toLowerCase().includes(words.split(" ")[0])
  );
  search.searched = true;
  search.error = null;
}

/* ---------- overlay actions ---------- */

function openConfirm(message, severity, action) { confirmOverlay = { message, severity, action }; }
function fireConfirm() {
  if (!confirmOverlay) return;
  const action = confirmOverlay.action;
  confirmOverlay = null;
  action();
}
function openTextPrompt(title, initial, onSubmit) {
  textPrompt = { title, buf: initial, cursor: initial.length, onSubmit };
}
function openPicker(track) {
  picker = { trackUri: track.uri, trackLabel: `${track.artist} — ${track.title}`, selected: 0, filter: { query: "", cursor: 0 } };
}
function pickedPlaylist() {
  const label = p => p.name;
  const pairs = pinnedFirst(filteredSorted(PLAYLISTS, picker.filter, label), pins.playlists, p => p.uri);
  return pairs[picker.selected] ? pairs[picker.selected][1] : null;
}
// Checks membership before adding rather than warning after -- a
// would-be duplicate can be caught before it happens at all, unlike an
// unwanted removal which is already real by the time you'd notice.
function confirmAddToPicker() {
  const target = pickedPlaylist();
  const trackUri = picker.trackUri, trackLabel = picker.trackLabel;
  picker = null;
  if (!target) return;
  const already = target.tracks.some(t => t.uri === trackUri);
  const doAdd = () => { target.tracks.push(Object.values(TRACKS).find(t => t.uri === trackUri)); setStatus("added to playlist"); render(); };
  if (already) {
    openConfirm(`“${trackLabel}” is already in “${target.name}”. Add it again anyway?`, "warn", doAdd);
    render();
  } else {
    doAdd();
  }
}

function removeTrackAt(playlist, idx) {
  const track = playlist.tracks[idx];
  const occurrences = playlist.tracks.filter(t => t.uri === track.uri).length;
  const message = occurrences > 1
    ? `“${track.artist} — ${track.title}” appears ${occurrences} times in this playlist -- Spotify's API can only remove ALL copies at once, not a single one. Remove all ${occurrences}?`
    : `Remove “${track.artist} — ${track.title}” from this playlist?`;
  openConfirm(message, "danger", () => {
    playlist.tracks = playlist.tracks.filter(t => t.uri !== track.uri);
    setSel(Math.max(0, getSel() - 1));
    setStatus("removed from playlist");
    render();
  });
}
function deletePlaylist(playlist) {
  openConfirm(`Delete playlist “${playlist.name}”?`, "danger", () => {
    PLAYLISTS = PLAYLISTS.filter(p => p.uri !== playlist.uri);
    pins.playlists.delete(playlist.uri);
    if (curScreen().screen === "playlistDetail" && curScreen().playlist.uri === playlist.uri) { pop(); focus = "sidebar"; }
    setSel(Math.max(0, getSel() - 1));
    setStatus("playlist deleted");
    render();
  });
}

// The one gated key in the app -- eligibility depends on filter/sort
// state, and the reason is surfaced as a status message rather than a
// blocking modal (this isn't destructive, just temporarily unavailable).
function tryEnterMoveMode(playlist, filter) {
  if (filter.editing || filter.query || filter.sortAlpha) { setStatus("clear the filter and turn off sort to reorder", true); render(); return; }
  if (playlist.tracks.length < 2) return;
  moveMode = { list: playlist.tracks, index: getSel(), start: getSel(), playlist };
  render();
}

// "The selected track," resolved the same way across every track-
// bearing screen -- pulled out once `a` and Shift+L both needed it.
function selectedTrackOnScreen(t) {
  if (t.screen === "likedSongs") return LIKED_SONGS[getSel()];
  if (t.screen === "albumDetail") return t.album.tracks[getSel()];
  if (t.screen === "queue") return QUEUE[getSel()];
  if (t.screen === "playlistDetail") {
    const pairs = pinnedFirst(filteredSorted(t.playlist.tracks, playlistFilter(t.playlist.uri), tr => tr.artist + " " + tr.title), pins.tracks, tr => tr.uri);
    return pairs[getSel()] ? pairs[getSel()][1] : null;
  }
  return null;
}

function handleGlobalKeys(key) {
  if (key === " ") { togglePlay(); return true; }
  if (key === "n") { doNext(); return true; }
  if (key === "p") { doPrev(); return true; }
  if (key === "s") { toggleShuffle(); return true; }
  if (key === "R") { toggleRepeat(); return true; }
  if (key === "+") { nowPlaying.vol = Math.min(100, nowPlaying.vol + 10); render(); return true; }
  if (key === "-") { nowPlaying.vol = Math.max(0, nowPlaying.vol - 10); render(); return true; }
  if (key === "f") { if (curScreen().screen === "nowplaying") fullscreen = !fullscreen; else { fullscreen = true; goto("nowplaying"); } render(); return true; }
  if (key === "l") { goto("library"); render(); return true; }
  if (key === "c") { openTextPrompt("New playlist name", "", (name) => {
      const p = { uri: "spotify:playlist:new" + Date.now(), name: name || "untitled", tracks: [] };
      PLAYLISTS.push(p); setStatus("playlist created"); render();
    }); render(); return true; }
  return false;
}

document.addEventListener("keydown", (e) => {
  const key = e.key;
  const t = curScreen();

  // Interception order mirrors the real app exactly: confirm > prompt >
  // picker > Tab > the q-confirms-quit gate > Sidebar-focus > Main-focus
  // per-screen dispatch. Whichever of the first three is set owns the
  // keypress completely -- nothing below it ever runs. Quick jump is a
  // fourth overlay of the same family, checked first alongside them.
  if (quickJump) {
    const matches = quickJumpMatches();
    if (key === "Escape") { quickJump = null; render(); }
    else if (key === "ArrowUp") { quickJump.selected = Math.max(0, quickJump.selected - 1); render(); }
    else if (key === "ArrowDown") { quickJump.selected = Math.min(Math.max(0, matches.length - 1), quickJump.selected + 1); render(); }
    else if (key === "Backspace") { quickJump.query = quickJump.query.slice(0, -1); quickJump.selected = 0; render(); }
    else if (key === "Enter") { activateQuickJump(matches[quickJump.selected]); }
    else if (key.length === 1) { quickJump.query += key; quickJump.selected = 0; render(); }
    e.preventDefault(); return;
  }
  // Works from literally anywhere, Search's query box included -- a
  // Ctrl-modified key is unambiguous and never collides with typing,
  // the same reasoning that already carves out Ctrl+→/Alt+→/Ctrl+↓ on
  // Search specifically.
  if (e.ctrlKey && key === "p" && !confirmOverlay && !textPrompt && !picker) {
    quickJump = { query: "", cursor: 0, selected: 0 }; render(); e.preventDefault(); return;
  }
  if (confirmOverlay) {
    if (key === "y" || key === "Enter") fireConfirm();
    else if (key === "n" || key === "Escape") confirmOverlay = null;
    render(); e.preventDefault(); return;
  }
  if (textPrompt) {
    if (key === "Escape") { textPrompt = null; render(); e.preventDefault(); return; }
    if (key === "Enter") { const onSubmit = textPrompt.onSubmit; const buf = textPrompt.buf; textPrompt = null; onSubmit(buf); e.preventDefault(); return; }
    if (key === "Backspace") { textPrompt.buf = textPrompt.buf.slice(0, textPrompt.cursor - 1) + textPrompt.buf.slice(textPrompt.cursor); textPrompt.cursor = Math.max(0, textPrompt.cursor - 1); render(); e.preventDefault(); return; }
    if (key === "ArrowLeft") { textPrompt.cursor = Math.max(0, textPrompt.cursor - 1); render(); e.preventDefault(); return; }
    if (key === "ArrowRight") { textPrompt.cursor = Math.min(textPrompt.buf.length, textPrompt.cursor + 1); render(); e.preventDefault(); return; }
    if (key.length === 1) { textPrompt.buf = textPrompt.buf.slice(0, textPrompt.cursor) + key + textPrompt.buf.slice(textPrompt.cursor); textPrompt.cursor++; render(); e.preventDefault(); return; }
    return;
  }
  if (picker) {
    const count = () => filteredSorted(PLAYLISTS, picker.filter, p => p.name).length;
    if (key === "Escape") { picker = null; render(); }
    else if (key === "ArrowUp") { picker.selected = Math.max(0, picker.selected - 1); render(); }
    else if (key === "ArrowDown") { picker.selected = Math.min(Math.max(0, count() - 1), picker.selected + 1); render(); }
    else if (key === "ArrowLeft") { picker.filter.cursor = Math.max(0, picker.filter.cursor - 1); render(); }
    else if (key === "ArrowRight") { picker.filter.cursor = Math.min(picker.filter.query.length, picker.filter.cursor + 1); render(); }
    else if (key === "Backspace") { const q = picker.filter.query; picker.filter.query = q.slice(0, picker.filter.cursor - 1) + q.slice(picker.filter.cursor); picker.filter.cursor = Math.max(0, picker.filter.cursor - 1); picker.selected = 0; render(); }
    else if (key === "Enter") { confirmAddToPicker(); }
    else if (key.length === 1) { const q = picker.filter.query; picker.filter.query = q.slice(0, picker.filter.cursor) + key + q.slice(picker.filter.cursor); picker.filter.cursor++; picker.selected = 0; render(); }
    e.preventDefault(); return;
  }
  if (key === "Tab") { focus = focus === "sidebar" ? "main" : "sidebar"; render(); e.preventDefault(); return; }
  // `q` asks first, same as every other destructive action -- except
  // Search, where it's never a quit key at all (a literal character the
  // query box needs, same standing exception as every other letter).
  if (key === "q" && !(focus === "main" && t.screen === "search")) {
    openConfirm("Quit spot-tui?", "neutral", () => { document.getElementById("main").innerHTML = `<div class="dim" style="padding:24px">bye.</div>`; });
    render(); e.preventDefault(); return;
  }

  // ---- sidebar-focused navigation (no `c` here -- verified: the real
  // Sidebar has no create-playlist binding of its own, only Your
  // Playlists does) ----
  if (focus === "sidebar") {
    const selectable = sidebarEntries().filter(x => x.type !== "divider" && x.type !== "section");
    if (key === "ArrowUp") { sidebarSel = Math.max(0, sidebarSel - 1); render(); }
    else if (key === "ArrowDown") { sidebarSel = Math.min(selectable.length - 1, sidebarSel + 1); render(); }
    else if (key === "Enter" || key === "Right") { activateSidebarEntry(selectable[sidebarSel]); }
    else if (key === "?") { push("help"); focus = "main"; render(); }
    else if (key === "f") { fullscreen = true; goto("nowplaying"); render(); }
    else if (key === "/") { openScreenFromSidebar("search"); focus = "main"; render(); }
    else if (key === "P") {
      const entry = selectable[sidebarSel];
      if (entry && entry.type === "playlist") { const u = entry.playlist.uri; pins.playlists.has(u) ? pins.playlists.delete(u) : pins.playlists.add(u); render(); }
    }
    e.preventDefault(); return;
  }

  // ---- Main focus, per screen ----
  if (t.screen === "search") {
    if (key === "Escape") { pop(); focus = stack.length === 1 ? "sidebar" : focus; render(); }
    else if (key === "Backspace") { search.query = search.query.slice(0, search.cursor - 1) + search.query.slice(search.cursor); search.cursor = Math.max(0, search.cursor - 1); search.results = []; search.searched = false; search.error = null; render(); }
    else if (key === "ArrowLeft") { search.cursor = Math.max(0, search.cursor - 1); render(); }
    else if (e.ctrlKey && key === "ArrowRight") { const r = search.results[getSel()]; if (r) { push("albumDetail", { album: ALBUMS.find(a => a.name === r.album) || { name: r.album, artist: r.artist, tracks: [r] } }); } render(); }
    else if (e.altKey && key === "ArrowRight") { const r = search.results[getSel()]; if (r) { push("artistDetail", { artist: ARTISTS.find(a => a.name === r.artist) || { name: r.artist, genres: [], albums: [] } }); } render(); }
    else if (key === "ArrowRight") { search.cursor = Math.min(search.query.length, search.cursor + 1); render(); }
    else if (key === "ArrowUp") { setSel(Math.max(0, getSel() - 1)); render(); }
    else if (e.ctrlKey && key === "ArrowDown") { const r = search.results[getSel()]; if (r) { openPicker(r); } render(); }
    else if (key === "ArrowDown") { if (search.results.length) setSel(Math.min(search.results.length - 1, getSel() + 1)); render(); }
    // Alt+Enter, not bare `!` -- every printable character on Search has
    // to reach the query box with zero exceptions (that's the whole
    // point of this screen), so the demo-error trigger every other
    // fetchable screen uses had to become a modifier combo here instead,
    // same reasoning as Ctrl+→/Alt+→/Ctrl+↓ already being modifier-only.
    else if (e.altKey && key === "Enter") { search.error = "HTTP 400 Bad Request: Invalid limit"; search.results = []; render(); }
    else if (key === "Enter") {
      if (search.results.length === 0) { if (search.query.trim()) doSearch(search.query); }
      else { const r = search.results[getSel()]; nowPlaying.track = r; nowPlaying.playing = true; nowPlaying.pos = 0; nowPlaying.contextLabel = "Search"; goto("nowplaying"); }
      render();
    } else if (key.length === 1) {
      search.query = search.query.slice(0, search.cursor) + key + search.query.slice(search.cursor); search.cursor++; search.results = []; search.searched = false; search.error = null; render();
    }
    e.preventDefault(); return;
  }

  if (moveMode) {
    if (key === "ArrowUp" && moveMode.index > 0) {
      const l = moveMode.list; [l[moveMode.index - 1], l[moveMode.index]] = [l[moveMode.index], l[moveMode.index - 1]];
      moveMode.index--; setSel(moveMode.index);
    } else if (key === "ArrowDown" && moveMode.index < moveMode.list.length - 1) {
      const l = moveMode.list; [l[moveMode.index + 1], l[moveMode.index]] = [l[moveMode.index], l[moveMode.index + 1]];
      moveMode.index++; setSel(moveMode.index);
    } else if (key === "Enter") {
      setStatus(moveMode.index === moveMode.start ? "unchanged" : "reordered"); moveMode = null;
    } else if (key === "Escape") {
      // Walks back to the start index -- only one track ever actually
      // moved, so this exactly restores original order.
      const l = moveMode.list; let i = moveMode.index;
      while (i > moveMode.start) { [l[i - 1], l[i]] = [l[i], l[i - 1]]; i--; }
      while (i < moveMode.start) { [l[i + 1], l[i]] = [l[i], l[i + 1]]; i++; }
      setSel(moveMode.start); moveMode = null;
    } else if (key === "g") {
      // One-at-a-time nudging is O(distance) -- moving a track 49 slots
      // takes 49 keystrokes, the single most quantifiable place this
      // app is slower than a mouse drag in real Spotify. `g` jumps
      // straight to a position instead, closing that gap without
      // touching the reorder API (still one reorder_track call on
      // confirm either way -- this only changes how many local swaps
      // happen before that call).
      const n = moveMode.list.length;
      openTextPrompt(`Move to position (1-${n})`, String(moveMode.index + 1), (buf) => {
        const target = Math.min(n, Math.max(1, parseInt(buf, 10) || (moveMode.index + 1))) - 1;
        const [item] = moveMode.list.splice(moveMode.index, 1);
        moveMode.list.splice(target, 0, item);
        moveMode.index = target; setSel(target);
        render();
      });
      render(); e.preventDefault(); return;
    }
    render(); e.preventDefault(); return;
  }

  const filterable = { likedSongs: filters.likedSongs, savedAlbums: filters.savedAlbums, followedArtists: filters.followedArtists, yourPlaylists: filters.yourPlaylists,
                        playlistDetail: t.screen === "playlistDetail" ? playlistFilter(t.playlist.uri) : null }[t.screen];
  if (filterable) {
    const filter = filterable;
    if (filter.editing) {
      if (key === "Escape") { filter.editing = false; filter.query = ""; filter.cursor = 0; setSel(0); render(); e.preventDefault(); return; }
      if (key === "Enter") { filter.editing = false; render(); e.preventDefault(); return; }
      if (key === "Backspace") { filter.query = filter.query.slice(0, filter.cursor - 1) + filter.query.slice(filter.cursor); filter.cursor = Math.max(0, filter.cursor - 1); setSel(0); render(); e.preventDefault(); return; }
      if (key === "ArrowLeft") { filter.cursor = Math.max(0, filter.cursor - 1); render(); e.preventDefault(); return; }
      if (key === "ArrowRight") { filter.cursor = Math.min(filter.query.length, filter.cursor + 1); render(); e.preventDefault(); return; }
      if (key.length === 1) { filter.query = filter.query.slice(0, filter.cursor) + key + filter.query.slice(filter.cursor); filter.cursor++; setSel(0); render(); e.preventDefault(); return; }
    } else if (key === "Escape" && filter.query) { filter.query = ""; filter.cursor = 0; setSel(0); render(); e.preventDefault(); return; }
    else if (key === "/") { filter.editing = true; filter.cursor = filter.query.length; render(); e.preventDefault(); return; }
    else if (key === "o") { filter.sortAlpha = !filter.sortAlpha; render(); e.preventDefault(); return; }
  }

  // Cycles the 3 real LyricsState variants besides Synced that this
  // preview otherwise never has a reason to render (Instrumental,
  // NotFound, Plain/unsynced) -- same debug convention as forcing an
  // error state elsewhere, applied to Now Playing specifically.
  if (key === "!" && t.screen === "nowplaying") {
    const order = ["synced", "plain", "instrumental", "notfound"];
    lyricsDemoState = order[(order.indexOf(lyricsDemoState) + 1) % order.length];
    render(); e.preventDefault(); return;
  }
  if (key === "!") { const keys = { likedSongs: "likedSongs", savedAlbums: "savedAlbums", followedArtists: "followedArtists", yourPlaylists: "yourPlaylists", queue: "queue", devices: "devices",
      artistDetail: t.artist ? "artistDetail:" + t.artist.uri : null, albumDetail: t.album ? "albumDetail:" + t.album.name : null, playlistDetail: t.playlist ? "playlistDetail:" + t.playlist.uri : null }[t.screen];
    if (keys) { forceRefetchAsError(keys); render(); } e.preventDefault(); return; }
  if (key === "r" && t.screen === "devices") { visitedOnce.delete("devices"); ensureFetched("devices"); render(); return; }

  if (t.screen === "nowplaying") {
    if (key === "ArrowLeft") { nowPlaying.pos = Math.max(0, nowPlaying.pos - 5); render(); e.preventDefault(); return; }
    if (key === "ArrowRight") { nowPlaying.pos = Math.min(nowPlaying.dur, nowPlaying.pos + 5); render(); e.preventDefault(); return; }
    if (key === "ArrowUp") { nowPlaying.vol = Math.min(100, nowPlaying.vol + 10); render(); e.preventDefault(); return; }
    if (key === "ArrowDown") { nowPlaying.vol = Math.max(0, nowPlaying.vol - 10); render(); e.preventDefault(); return; }
    if (key === "Escape") { focus = "sidebar"; render(); return; }
    if (key === "/") { openScreenFromSidebar("search"); render(); return; }
    if (key === "a" && nowPlaying.track) { openPicker(nowPlaying.track); render(); return; }
    if (key === "L" && nowPlaying.track) {
      const tr = nowPlaying.track;
      if (liked.has(tr.uri)) { liked.delete(tr.uri); setStatus("removed from Liked Songs"); }
      else { liked.add(tr.uri); if (!LIKED_SONGS.some(x => x.uri === tr.uri)) LIKED_SONGS.unshift(tr); setStatus("added to Liked Songs"); }
      render(); return;
    }
    if (handleGlobalKeys(key)) return;
    return;
  }
  if (handleGlobalKeys(key)) return;

  if (key === "Escape" || key === "ArrowLeft") {
    if (stack.length > 1) pop(); if (stack.length === 1) focus = "sidebar"; render(); return;
  }

  const count = { library: 4, likedSongs: LIKED_SONGS.length, savedAlbums: ALBUMS.length, followedArtists: ARTISTS.length, yourPlaylists: PLAYLISTS.length,
    queue: QUEUE.length, devices: DEVICES.length, artistDetail: t.artist ? t.artist.albums.length : 0,
    albumDetail: t.album ? t.album.tracks.length : 0, playlistDetail: t.playlist ? t.playlist.tracks.length : 0 }[t.screen] || 0;
  if (key === "ArrowUp" && count) { setSel(Math.max(0, getSel() - 1)); render(); return; }
  if (key === "ArrowDown" && count) { setSel(Math.min(count - 1, getSel() + 1)); render(); return; }

  const pureNavRight = key === "ArrowRight" && ["library", "savedAlbums", "followedArtists", "yourPlaylists", "artistDetail"].includes(t.screen);
  if (key === "Enter" || pureNavRight) {
    if (t.screen === "library") { push(["likedSongs", "savedAlbums", "followedArtists", "yourPlaylists"][getSel()]); }
    else if (t.screen === "likedSongs") { const tr = LIKED_SONGS[getSel()]; nowPlaying.track = tr; nowPlaying.playing = true; nowPlaying.pos = 0; nowPlaying.contextLabel = "Liked Songs"; goto("nowplaying"); }
    else if (t.screen === "savedAlbums") { push("albumDetail", { album: ALBUMS[getSel()] }); }
    else if (t.screen === "followedArtists") { push("artistDetail", { artist: ARTISTS[getSel()] }); }
    else if (t.screen === "yourPlaylists") { push("playlistDetail", { playlist: PLAYLISTS[getSel()] }); }
    else if (t.screen === "artistDetail") { const albumName = t.artist.albums[getSel()]; push("albumDetail", { album: ALBUMS.find(a => a.name === albumName) || { name: albumName, artist: t.artist.name, tracks: [] } }); }
    else if (t.screen === "albumDetail" && key === "Enter") { const tr = t.album.tracks[getSel()]; if (tr) { nowPlaying.track = tr; nowPlaying.playing = true; nowPlaying.pos = 0; nowPlaying.contextLabel = t.album.name; goto("nowplaying"); } }
    else if (t.screen === "playlistDetail" && key === "Enter" && t.playlist.tracks.length) { const tr = t.playlist.tracks[getSel()]; nowPlaying.track = tr; nowPlaying.playing = true; nowPlaying.pos = 0; nowPlaying.contextLabel = t.playlist.name; goto("nowplaying"); }
    else if (t.screen === "queue" && key === "Enter") { queueIndex = getSel(); nowPlaying.track = QUEUE[queueIndex]; nowPlaying.playing = true; nowPlaying.pos = 0; nowPlaying.contextLabel = "Queue"; goto("nowplaying"); }
    else if (t.screen === "devices" && key === "Enter") { DEVICES.forEach((d, i) => d.active = (i === getSel())); setStatus("transferred playback"); }
    render(); return;
  }

  if (key === "a") {
    const track = selectedTrackOnScreen(t);
    if (track) { openPicker(track); render(); }
    return;
  }
  // Real, currently-missing product gap: spot-tui has no way to like a
  // track from inside the app at all today. Not wired on Search (every
  // printable char there has to reach the query box, same standing
  // exception a/c/v/d/r already have -- Shift+L would just type "L").
  if (key === "L" && (t.screen === "likedSongs" || t.screen === "playlistDetail" || t.screen === "queue" || t.screen === "albumDetail")) {
    const tr = selectedTrackOnScreen(t);
    if (tr) {
      if (liked.has(tr.uri)) {
        liked.delete(tr.uri);
        if (t.screen === "likedSongs") { LIKED_SONGS.splice(LIKED_SONGS.findIndex(x => x.uri === tr.uri), 1); setSel(Math.max(0, getSel() - 1)); }
        setStatus("removed from Liked Songs");
      } else {
        liked.add(tr.uri);
        if (!LIKED_SONGS.some(x => x.uri === tr.uri)) LIKED_SONGS.unshift(tr);
        setStatus("added to Liked Songs");
      }
      render();
    }
    return;
  }
  if ((key === "v" || key === "V") && (t.screen === "likedSongs" || t.screen === "playlistDetail" || t.screen === "queue" || t.screen === "albumDetail")) {
    const isArtist = key === "V" || e.shiftKey;
    const list = t.screen === "likedSongs" ? LIKED_SONGS : t.screen === "queue" ? QUEUE : t.screen === "playlistDetail" ? t.playlist.tracks : null;
    if (t.screen === "albumDetail") { push("artistDetail", { artist: ARTISTS.find(a => a.name === t.album.artist) || { name: t.album.artist, genres: [], albums: [] } }); render(); return; }
    const tr = list[getSel()];
    if (!tr) return;
    if (isArtist) push("artistDetail", { artist: ARTISTS.find(a => a.name === tr.artist) || { name: tr.artist, genres: [], albums: [] } });
    else push("albumDetail", { album: ALBUMS.find(a => a.name === tr.album) || { name: tr.album, artist: tr.artist, tracks: [tr] } });
    render(); return;
  }
  if (key === "F" && t.screen === "artistDetail") {
    const u = t.artist.uri;
    following.has(u) ? following.delete(u) : following.add(u);
    setStatus(following.has(u) ? "following" : "unfollowed"); render(); return;
  }
  if (key === "S" && t.screen === "albumDetail") {
    const n = t.album.name;
    savedAlbumUris.has(n) ? savedAlbumUris.delete(n) : savedAlbumUris.add(n);
    setStatus(savedAlbumUris.has(n) ? "saved to your library" : "removed from your library"); render(); return;
  }
  if (key === "r" && t.screen === "playlistDetail") { openTextPrompt("Rename playlist", t.playlist.name, (name) => { if (name) t.playlist.name = name; setStatus("renamed"); render(); }); render(); return; }
  if (key === "r" && t.screen === "yourPlaylists" && PLAYLISTS.length) { const p = PLAYLISTS[getSel()]; openTextPrompt("Rename playlist", p.name, (name) => { if (name) p.name = name; setStatus("renamed"); render(); }); render(); return; }
  if (key === "d" && t.screen === "playlistDetail" && t.playlist.tracks.length) { removeTrackAt(t.playlist, getSel()); render(); return; }
  if (key === "d" && t.screen === "yourPlaylists" && PLAYLISTS.length) { deletePlaylist(PLAYLISTS[getSel()]); render(); return; }
  if ((key === "D") && t.screen === "playlistDetail") { deletePlaylist(t.playlist); render(); return; }
  if (key === "P") {
    if (t.screen === "yourPlaylists" && PLAYLISTS.length) { const u = PLAYLISTS[getSel()].uri; pins.playlists.has(u) ? pins.playlists.delete(u) : pins.playlists.add(u); render(); return; }
    if (t.screen === "playlistDetail" && t.playlist.tracks.length) { const u = t.playlist.tracks[getSel()].uri; pins.tracks.has(u) ? pins.tracks.delete(u) : pins.tracks.add(u); render(); return; }
  }
  if (key === "m" && t.screen === "playlistDetail") { tryEnterMoveMode(t.playlist, playlistFilter(t.playlist.uri)); return; }
});

/* ---------- mouse support (bonus on top of keys) ---------- */

document.getElementById("sidebar").addEventListener("click", (e) => {
  const row = e.target.closest("[data-i]");
  if (!row) return;
  focus = "sidebar";
  sidebarSel = parseInt(row.dataset.i, 10);
  const selectable = sidebarEntries().filter(x => x.type !== "divider" && x.type !== "section");
  activateSidebarEntry(selectable[sidebarSel]);
});

document.getElementById("main").addEventListener("click", (e) => {
  // Click-to-seek on the progress gauge -- previously keyboard-only
  // (±5s via ←/→), unlike real Spotify's own clickable scrubber.
  const gauge = e.target.closest(".gauge-track");
  if (gauge && nowPlaying.track) {
    const rect = gauge.getBoundingClientRect();
    const frac = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
    nowPlaying.pos = Math.round(frac * nowPlaying.dur);
    render();
    return;
  }
  const row = e.target.closest("[data-i]");
  if (!row || confirmOverlay || textPrompt || picker) return;
  focus = "main";
  setSel(parseInt(row.dataset.i, 10));
  render();
});
// Scroll-to-adjust-volume over the playback bar or the Now Playing
// gauge -- real Spotify's volume slider is draggable; a scroll wheel is
// the closest mouse-native equivalent for a bar with no drag handle.
function wheelVolume(e) {
  e.preventDefault();
  nowPlaying.vol = Math.max(0, Math.min(100, nowPlaying.vol + (e.deltaY < 0 ? 5 : -5)));
  render();
}
document.getElementById("playbar").addEventListener("wheel", wheelVolume, { passive: false });
document.getElementById("main").addEventListener("wheel", (e) => {
  if (e.target.closest(".gauge-track") || e.target.closest(".np-side")) wheelVolume(e);
}, { passive: false });

document.getElementById("playbar").addEventListener("click", (e) => {
  const btn = e.target.closest("[data-act]");
  if (!btn) return;
  const act = btn.dataset.act;
  if (act === "prev") doPrev();
  else if (act === "next") doNext();
  else if (act === "playpause") togglePlay();
  else if (act === "shuffle") toggleShuffle();
  else if (act === "repeat") toggleRepeat();
});

function render() { renderScreen(); }
render();
</script>
</body>
</html>
