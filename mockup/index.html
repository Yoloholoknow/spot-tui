<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>spot-tui design preview</title>
<style>
  /* ---------- design tokens ----------
     Consolidated from the v1 mockup's ad-hoc values (11+ distinct font
     sizes, padding numbers that didn't share a scale) into an explicit
     system: a 4/8/12/16/24/32 spacing scale, a 5-step type scale (each
     step earns its keep: micro/meta/body/header/hero -- fewer than that
     and screen titles stop reading as titles), and named surfaces instead
     of one flat --panel for both sidebar and modals. */
  :root {
    --bg: #0b0e14;
    --surface: #12161f;
    --surface-2: #181d29;
    --border: #262c3a;
    --border-soft: #1c212c;
    --text: #dbe2ea;
    --text-dim: #7c869a;
    --text-faint: #4b5468;
    --accent: #3ecf8e;
    --accent-soft: rgba(62,207,142,0.14);
    --accent-dim: #2b8f63;
    --danger: #ef6a63;
    --danger-soft: rgba(239,106,99,0.12);
    --warn: #e0a83f;
    --warn-soft: rgba(224,168,63,0.12);
    /* type scale -- micro(pills/hints/status) meta(secondary lines)
       body(base/rows) header(screen titles) hero(Now Playing only) */
    --fs-micro: 11px;
    --fs-meta: 13px;
    --fs-body: 15px;
    --fs-header: 18px;
    --fs-hero: 24px;
    /* spacing scale -- every padding/margin/gap below snaps to one of
       these, no in-between numbers */
    --sp-1: 4px;
    --sp-2: 8px;
    --sp-3: 12px;
    --sp-4: 16px;
    --sp-6: 24px;
    --sp-8: 32px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #05070a;
    color: var(--text);
    font-family: "SF Mono", "Menlo", "Consolas", monospace;
    font-size: var(--fs-body);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #shell {
    width: 1220px;
    max-width: 97vw;
    height: 720px;
    max-height: 92vh;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    position: relative;
  }
  #titlebar {
    background: #080a10;
    padding: var(--sp-2) var(--sp-3);
    font-size: var(--fs-micro);
    color: var(--text-dim);
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
  }
  #titlebar .dots span {
    display: inline-block; width: 9px; height: 9px; border-radius: 50%;
    margin-right: var(--sp-2); background: #333;
  }
  #body { flex: 1; display: flex; overflow: hidden; min-height: 0; }

  /* ---------- sidebar ---------- */
  #sidebar {
    width: 230px; flex-shrink: 0; overflow-y: auto;
    padding: var(--sp-2) 0; background: var(--surface);
    border-right: 1px solid var(--border);
    border-top: 2px solid transparent;
  }
  #sidebar.focused { border-top-color: var(--accent); }
  .sb-section { padding: var(--sp-3) var(--sp-4) var(--sp-1); font-size: var(--fs-micro); letter-spacing: 1px; color: var(--text-faint); }
  .sb-divider { height: 1px; background: var(--border); margin: var(--sp-2) var(--sp-3); }
  .sb-item {
    padding: var(--sp-1) var(--sp-4); cursor: pointer; display: flex; gap: var(--sp-2); align-items: center;
    border-left: 2px solid transparent; color: var(--text);
  }
  .sb-item .ic { color: var(--text-faint); width: 12px; display: inline-block; text-align: center; flex-shrink: 0; }
  .sb-item .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .sb-item .pin { color: var(--warn); font-size: var(--fs-micro); flex-shrink: 0; }
  .sb-item.sel { background: var(--accent-soft); }
  .sb-item.sel .pin { color: var(--accent-dim); }
  .sb-item.open { border-left-color: var(--accent); color: var(--accent); font-weight: 700; }

  /* ---------- main pane ---------- */
  #main {
    flex: 1; min-width: 0; overflow-y: auto;
    padding: var(--sp-4) var(--sp-6);
    border-top: 2px solid transparent;
  }
  #main.focused { border-top-color: var(--accent); }
  .screen-header {
    font-size: var(--fs-header); font-weight: 700; color: var(--text);
    display: flex; align-items: baseline; gap: var(--sp-2); flex-wrap: wrap;
    margin-bottom: var(--sp-3);
  }
  .screen-header .num { color: var(--accent); }
  .rule { border: none; border-top: 1px solid var(--border); margin: 0 0 var(--sp-3); }

  /* one shared row shape for every list on every screen: a fixed-width
     marker column, a truncating primary label, and right-aligned dim
     meta -- replaces the v1 mockup's ad-hoc concatenated strings
     ("name (N tracks)", "artist — title") with real columns the eye can
     track down, the way a scannable table should read. */
  .row {
    display: flex; align-items: baseline; gap: var(--sp-2);
    padding: var(--sp-1) var(--sp-2); cursor: pointer;
  }
  .row-marker { width: 16px; flex-shrink: 0; text-align: center; color: var(--text-faint); }
  .row-primary { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
  .row-meta { flex-shrink: 0; color: var(--text-dim); font-size: var(--fs-meta); }
  .row-heart { width: 14px; flex-shrink: 0; text-align: center; color: var(--border); font-size: var(--fs-meta); }
  .row-heart.liked { color: var(--danger); }
  .row.sel { background: var(--accent-soft); }
  .row.sel .row-primary { color: var(--accent); font-weight: 700; }
  .row.sel .row-meta { color: var(--accent-dim); }
  .row.pinned .row-marker { color: var(--warn); }
  .row.playing .row-marker { color: var(--accent); }
  .row.moving { background: var(--warn-soft); }
  .row.danger .row-primary { color: var(--danger); }
  /* A pinned row that's also the selected row was showing an amber
     pin mark next to green selected text -- two accent colors on one
     row, nobody chose that on purpose (pinning and selection shipped
     in different phases and were never checked together). Selection
     wins; the pin state is still visible from the marker glyph itself
     (★), it just stops fighting for a second color. */
  .row.sel .row-marker { color: var(--accent-dim); }

  .filter-header {
    display: flex; align-items: baseline; gap: var(--sp-2);
    color: var(--text-dim); font-size: var(--fs-meta); margin: 0 0 var(--sp-2);
  }
  .filter-header .live { color: var(--text); }
  .hint { color: var(--text-faint); font-size: var(--fs-meta); }
  .pill {
    display: inline-block; border: 1px solid var(--border);
    padding: 0 var(--sp-2); font-size: var(--fs-micro); color: var(--text-dim);
  }

  /* ---------- state design: loading / error / empty ----------
     Designed as their own thing, not a stripped-down list -- a screen
     that only ever shows its happy path hides the states users actually
     live in most (real 400s and empty libraries were the two most
     live-reported pain points this project has had). */
  /* Horizontal padding matches .row's own -- an empty/error/loading
     message was sitting less indented than the real rows it replaces. */
  .state-block { padding: var(--sp-4) var(--sp-2); }
  .state-loading { color: var(--text-faint); }
  .state-error {
    border: 1px solid var(--danger); background: var(--danger-soft);
    padding: var(--sp-3) var(--sp-4); color: var(--danger);
  }
  .state-error .retry { color: var(--text-dim); margin-top: var(--sp-2); font-size: var(--fs-meta); }
  .state-empty { color: var(--text-faint); }
  .state-empty .headline { color: var(--text-dim); margin-bottom: var(--sp-1); }

  /* ---------- playback bar ---------- */
  #playbar {
    border-top: 1px solid var(--border); background: var(--surface);
    padding: var(--sp-2) var(--sp-4); display: flex; align-items: center; gap: var(--sp-3);
  }
  .pb-art {
    width: 36px; height: 36px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: var(--fs-meta); font-weight: 700; color: rgba(255,255,255,.85);
  }
  .pb-info { min-width: 0; width: 190px; flex-shrink: 0; }
  .pb-title, .pb-artist { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pb-title { font-size: var(--fs-meta); color: var(--text); }
  .pb-artist { font-size: var(--fs-micro); color: var(--text-dim); }
  .pb-gauge { flex: 1; font-size: var(--fs-micro); color: var(--text-dim); display: flex; align-items: center; gap: var(--sp-2); }
  .pb-vol { font-size: var(--fs-micro); color: var(--text-dim); width: 58px; text-align: right; flex-shrink: 0; }
  .pb-controls { display: flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-body); flex-shrink: 0; }
  .pb-toggles { display: flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-micro); font-weight: 700; flex-shrink: 0; }
  .pb-btn { cursor: pointer; color: var(--text-dim); }
  .pb-btn.accent { color: var(--accent); }

  /* ---------- now playing hero ---------- */
  /* No rounded corners, no drop shadow, no gradient (see artStyle() in
     the script) -- a real terminal cell grid can't do any of the three:
     ratatui paints one solid background color per cell, sharp corners
     only, and there's no compositing pass for a soft shadow to live in.
     This block is exactly what the real app can actually render: a flat
     rectangle of one hashed color plus a monogram. */
  .art-hero {
    width: 200px; height: 200px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; position: relative;
  }
  .art-mono { font-size: 56px; font-weight: 700; color: rgba(255,255,255,.85); letter-spacing: 2px; }
  /* Compact Now Playing: hero row fixed at top, lyrics fill the rest of
     the pane and scroll on their own -- the default view now shows the
     *whole* sheet (like official Spotify's lyrics tab), not a ±2-line
     peephole, so it needs its own scroll container instead of relying
     on #main's. */
  .now-playing { display: flex; flex-direction: column; height: 100%; min-height: 0; }
  .np-side { display: flex; gap: var(--sp-6); align-items: flex-start; margin-bottom: var(--sp-4); flex-shrink: 0; }
  .np-meta { padding-top: var(--sp-1); min-width: 0; }
  .np-title { font-size: var(--fs-hero); font-weight: 700; color: var(--text); }
  .np-heart { font-size: var(--fs-body); color: var(--border); }
  .np-heart.liked { color: var(--danger); }
  .np-artist { font-size: var(--fs-body); color: var(--text-dim); margin-top: 2px; }
  .np-context { font-size: var(--fs-meta); color: var(--text-faint); margin-top: 2px; }
  .np-transport { margin-top: var(--sp-4); font-size: var(--fs-meta); color: var(--text-dim); }
  .gauge-track { font-family: monospace; margin-top: var(--sp-1); cursor: pointer; }
  .gauge-fill { color: var(--accent); }
  .gauge-empty { color: var(--border); }
  .lyrics-pane { flex: 1; min-height: 0; overflow-y: auto; font-size: 16px; line-height: 1.9; }
  /* Every line stays the same size -- a terminal cell grid is uniform,
     there's no such thing as one line of text being physically bigger
     than its neighbors. Bold + accent color is the entire toolkit a
     real TUI has for "this is the current line," so that's all this
     uses too. No transition either -- terminal redraws are instant,
     never an animated fade between frames. */
  /* --text-faint reads at roughly 1.4:1 against --bg -- fine for a
     one-word hint, unreadable as the primary content of the exact
     screen built to show all of it. --text-dim clears real body-text
     contrast. */
  .lyrics-pane .lyric-line { color: var(--text-dim); }
  .lyrics-pane .lyric-section { color: var(--text-faint); font-size: var(--fs-micro); letter-spacing: 1px; text-transform: uppercase; padding-top: var(--sp-3); }
  .lyrics-pane .cur { color: var(--text); font-weight: 700; }
  .np-idle { color: var(--text-dim); padding-top: var(--sp-6); }

  /* Fullscreen: a real two-pane "beautiful lyrics" layout -- art +
     song info anchored on one side, the full lyric sheet given the
     other, wider half, instead of everything stacked in one centered
     column. This is the one screen allowed to break the app's normal
     single-column convention, same reasoning Help's 2-column reference
     already earned: a fundamentally different job (immersive reading),
     not a list to navigate. */
  #shell.fullscreen #sidebar, #shell.fullscreen #playbar { display: none; }
  #shell.fullscreen #main { padding: var(--sp-8) var(--sp-8); }
  #shell.fullscreen .now-playing.fs { flex-direction: row; align-items: stretch; gap: var(--sp-8); height: 100%; }
  #shell.fullscreen .np-side { flex: 0 0 300px; display: flex; flex-direction: column; justify-content: center; }
  #shell.fullscreen .art-hero { width: 260px; height: 260px; }
  #shell.fullscreen .art-mono { font-size: 72px; }
  #shell.fullscreen .np-title { font-size: 30px; }
  #shell.fullscreen .np-artist { font-size: 17px; }
  #shell.fullscreen .lyrics-pane { flex: 1; min-width: 0; font-size: 22px; line-height: 2; padding-left: var(--sp-6); border-left: 1px solid var(--border); }

  /* ---------- status line ---------- */
  #statusbar {
    border-top: 1px solid var(--border);
    padding: var(--sp-2) var(--sp-3);
    font-size: var(--fs-micro);
    color: var(--text-dim);
    background: var(--surface);
    display: flex; align-items: center; gap: var(--sp-2);
  }
  #statusbar b { color: var(--text); }
  #statusbar.ok { color: var(--accent); }
  #statusbar.err { color: var(--danger); }

  .header { font-weight: 700; color: var(--text); }
  .dim { color: var(--text-dim); }
  .faint { color: var(--text-faint); }
  .accent { color: var(--accent); font-weight: 700; }
  .danger { color: var(--danger); }
  .warn { color: var(--warn); }
  .cursor { background: var(--text); color: var(--bg); }

  /* ---------- overlays: confirm / prompt / picker ----------
     Severity is now a real, consistently-applied signal instead of
     every confirm using the same red border regardless of stakes:
     danger = irreversible (delete playlist, remove track), warn = a
     heads-up that's easy to undo (duplicate-add), neutral = a plain
     yes/no with no risk framing (quit). Reading the border color alone
     should tell you how carefully to read the text before answering. */
  .modal-overlay {
    position: absolute; inset: 0; background: rgba(5,7,10,0.72);
    display: flex; align-items: center; justify-content: center;
    z-index: 10;
  }
  /* Sharp corners -- the real overlay is a ratatui Block with the
     default border type (┌─┐ / └─┘), not BorderType::Rounded. */
  .modal-box {
    background: var(--surface-2); border: 1px solid var(--accent-dim);
    padding: var(--sp-4) var(--sp-6); min-width: 320px; max-width: 640px;
  }
  .modal-box.sev-danger { border-color: var(--danger); }
  .modal-box.sev-warn { border-color: var(--warn); }
  .modal-box.sev-neutral { border-color: var(--accent-dim); }
  .modal-msg { margin-bottom: var(--sp-3); line-height: 1.5; }
  .modal-msg.sev-danger { color: var(--danger); }
  .modal-msg.sev-warn { color: var(--warn); }
  .modal-msg.sev-neutral { color: var(--text); }
  .modal-hint { color: var(--text-dim); font-size: var(--fs-meta); }
  .modal-btn { cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
  .modal-title { font-size: var(--fs-meta); color: var(--text-dim); margin-bottom: var(--sp-2); letter-spacing: .5px; }
  .prompt-input { color: var(--text); font-size: var(--fs-body); }

  .picker-box {
    background: var(--surface-2); border: 1px solid var(--accent-dim);
    padding: var(--sp-3) var(--sp-4); width: 380px; max-height: 380px;
    display: flex; flex-direction: column;
  }
  .picker-title { font-size: var(--fs-meta); color: var(--text-dim); margin-bottom: var(--sp-2); }
  .picker-filter { color: var(--text); margin-bottom: var(--sp-2); }
  .picker-list { overflow-y: auto; }

  /* ---------- help screen: dense 2-column reference ----------
     Help grew to 11 sections as the app grew; a single flat column
     would run several screens deep. Unlike the action lists elsewhere,
     Help is a reference the user scans, not a list they navigate item
     by item -- calibrating density to that expert-reference role earns
     the 2-column layout, a deliberate exception to the app's normal
     single-column convention. */
  .help-columns { display: flex; gap: var(--sp-8); align-items: flex-start; }
  .help-col { flex: 1; min-width: 0; }
  .help-section { margin-bottom: var(--sp-4); }
  .help-section-title { font-size: var(--fs-meta); font-weight: 700; color: var(--accent); margin-bottom: var(--sp-1); letter-spacing: .5px; }
  .help-row { display: flex; gap: var(--sp-3); padding: var(--sp-1) 0; }
  .help-key { color: var(--text); width: 108px; flex-shrink: 0; }
  .help-desc { color: var(--text-dim); }

  .banner {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text-dim);
    font-size: var(--fs-micro); padding: var(--sp-2) var(--sp-4); border-radius: 4px; font-family: monospace;
  }
</style>
</head>
<body>

<div class="banner">design preview -- not the real app -- keyboard AND mouse both work here for preview convenience</div>

<div id="shell">
  <div id="titlebar">
    <span class="dots"><span></span><span></span><span></span>spot-tui</span>
    <span id="breadcrumb">now playing</span>
  </div>
  <div id="body">
    <div id="sidebar"></div>
    <div id="main"></div>
  </div>
  <div id="playbar"></div>
  <div id="statusbar"></div>
</div>

<script>
window.onerror = function(msg, src, line, col, err) {
  const box = document.getElementById("main");
  if (box) {
    box.style.whiteSpace = "pre-wrap";
    box.innerHTML = "<div style=\"color:#e0645a\">JS ERROR: " + msg +
      "<br>at line " + line + ":" + col +
      (err && err.stack ? "<br><br>" + String(err.stack).replace(/</g,"&lt;") : "") + "</div>";
  }
  return false;
};

/* ---------- sample data (real artists/tracks from this project's own history) ---------- */

let uriSeq = 0;
const T = (title, artist, album, dur) => ({uri: "spotify:track:" + (uriSeq++), title, artist, album, dur});

const TRACKS = {

  listenDown: T("listen to this when you're down <3", "yung kai", "listen to this when you're down <3", "1:53"),
  besideYou:  T("beside you", "keshi", "GABRIEL", "2:46"),
  mindPrison: T("Mind Is A Prison", "Alec Benjamin", "(Un)Commentary", "2:44"),
  blue:       T("blue", "yung kai", "stay with the ocean, i'll find you", "3:34"),
  skeletons:  T("skeletons", "keshi", "skeletons", "2:32"),
  ithinkofyou:T("i think of you the most", "yung kai", "i think of you the most", "2:10"),
  sailorSong: T("Sailor Song", "Gigi Perez", "At The Beach, In Every Life", "3:31"),
  creep:      T("Creep", "Radiohead", "Pablo Honey", "3:59"),
  retour:     T("Nuit", "Tony Anderson", "Retour", "7:05"),

const LIKED_SONGS = [TRACKS.loveMeNot, TRACKS.listenDown, TRACKS.besideYou, TRACKS.mindPrison,
                      TRACKS.blue, TRACKS.skeletons, TRACKS.sailorSong, TRACKS.creep];

  {name: "GABRIEL", artist: "keshi", tracks: [TRACKS.besideYou, TRACKS.skeletons]},
  {name: "Pablo Honey", artist: "Radiohead", tracks: [TRACKS.creep]},
  {name: "Retour", artist: "Tony Anderson", tracks: [TRACKS.retour]},
];

// No `following` / `topTracks` -- Spotify removed the artist-top-tracks
// endpoint entirely (not a scope choice, see api::artist's own doc
// comment in the real app), and follow/unfollow was explicitly deferred
// as a non-goal for Phase 9's read-only Artist Detail. `genres` replaces
// them as the one extra fact the real ArtistDetail struct actually has.
const ARTISTS = [

   albums: ["listen to this when you're down <3", "stay with the ocean, i'll find you"]},

  {uri: "spotify:artist:radiohead", name: "Radiohead", genres: ["alternative rock"], albums: ["Pablo Honey"]},

let PLAYLISTS = [

  // specifically so the removal-warning flow has something real to
  // demonstrate without the user having to manually create one first.
  {uri: "spotify:playlist:latenight", name: "late night drive", tracks: [TRACKS.besideYou, TRACKS.blue, TRACKS.retour, TRACKS.blue]},
  {uri: "spotify:playlist:sadgirl", name: "sad girl hours", tracks: [TRACKS.listenDown, TRACKS.mindPrison]},
  {uri: "spotify:playlist:focus", name: "focus", tracks: [TRACKS.retour]},
];

const QUEUE = [TRACKS.blue, TRACKS.skeletons, TRACKS.sailorSong, TRACKS.creep];

const DEVICES = [
  {id: "d1", name: "This computer (spot-tui)", kind: "Computer", active: true, vol: 80},
  {id: "d2", name: "iPhone", kind: "Smartphone", active: false, vol: 60},
  {id: "d3", name: "Living Room speaker", kind: "Speaker", active: false, vol: 45},
];

// A full-length lyric sheet, not a 5-line snippet -- the whole point of
// this redesign is showing the entire song at once (like official
// Spotify's default lyrics view), so a short array would understate
// what the scrollable/auto-centering treatment is actually for.

  "and if I stay, I stay for you",
  "", "outro",
  "for you, for you, for you",
];
// Index into LYRICS currently "playing" -- driven by nowPlaying.pos so
// seeking (←/→) visibly moves which line is highlighted, same as a
// real synced lyric line advancing with playback.
const SECTION_LABELS = ["verse 1", "verse 2", "chorus", "bridge", "outro"];
// Only real sung lines are eligible to be "current" -- mapping playback
// progress across the raw array (including blank spacers and section
// labels) could land the highlight on an empty line with nothing to
// show, which is exactly what happened until this was caught: the
// default demo position (43/213s) landed on a blank spacer, so nothing
// was ever highlighted at all.
const REAL_LYRIC_INDICES = LYRICS.map((l, i) => i).filter(i => LYRICS[i] !== "" && !SECTION_LABELS.includes(LYRICS[i]));
function currentLyricIndex() {
  const progress = nowPlaying.pos / nowPlaying.dur;
  const pick = Math.min(REAL_LYRIC_INDICES.length - 1, Math.floor(progress * REAL_LYRIC_INDICES.length));
  return REAL_LYRIC_INDICES[Math.max(0, pick)];
}

/* ---------- state ---------- */

let stack = [{screen: "nowplaying"}];
let sel = {};              // selected index per screen key
// Real overlays are three sibling states, not Screen-stack variants
// (the plan's own "alternatives considered" rejected the Screen-variant
// approach: Help alone cost 8+ call sites when it was added that way).
// Exactly one of these three is non-null at a time; whichever is set
// owns every keypress, checked before Tab/focus/anything else.
let confirmOverlay = null;  // { message, severity: "danger"|"warn"|"neutral", action }
let textPrompt = null;      // { title, buf, cursor, kind: "create"|"rename", target }
let picker = null;          // { trackUri, trackLabel, selected, filter: {query, cursor} }
let moveMode = null;        // { list, index, start, playlist } while reordering
// contextLabel: "playing from X" -- real Spotify keeps this visible
// under the track; spot-tui's Now Playing currently loses it the moment
// you navigate away and back. Set at every "start playing" call site.
let nowPlaying = { track: TRACKS.loveMeNot, playing: true, pos: 43, dur: 213, vol: 100, contextLabel: "Liked Songs" };
// Cycled by `!` on Now Playing (same debug convention as the other
// fetchable screens) to review the 3 real LyricsState variants besides
// Synced that the app has never had a reason to render in this preview.
let lyricsDemoState = "synced"; // "synced" | "plain" | "instrumental" | "notfound"
// Search is always-live (no separate typing-vs-browsing mode) -- every
// printable character always reaches this, matching the real app's one
// standing exception where q/?/l/c/a/v never fire.
let search = { query: "", cursor: 0, results: [], searching: false, searched: false, error: null };
// Quick jump (Ctrl+P) -- fuzzy-jumps to any LOCAL entity (playlist,
// liked track, followed artist, saved album, device, or screen) by
// name, without drilling through Sidebar -> Library -> submenu first.
// Distinct from Search, which only ever hits the remote catalog. This
// is the single feature most likely to make spot-tui provably faster
// than official Spotify for everyday local navigation.
let quickJump = null; // { query, cursor, selected }
let focus = "sidebar";     // "sidebar" | "main"
let sidebarSel = 0;
let fullscreen = false;
let queueIndex = 0;        // index into QUEUE of the currently-playing track
let shuffle = false;
let repeat = false;
let status = null;         // { text, kind: "ok"|"err"|null }

// One ListFilter-shaped object per filterable screen -- `/` starts
// editing, typing narrows live, `o` toggles alpha sort, Esc is layered
// (clears the query first, only leaves on a second press once it's
// already empty). Playlist Detail's own filter lives in a Map keyed by
// playlist uri, reset fresh each time a playlist opens (matching the
// real PlaylistDetailState being rebuilt per open, not persisted).
function newFilter() { return { query: "", cursor: 0, editing: false, sortAlpha: false }; }
const filters = { likedSongs: newFilter(), savedAlbums: newFilter(), followedArtists: newFilter(), yourPlaylists: newFilter() };
const playlistFilters = new Map();
function playlistFilter(uri) {
  if (!playlistFilters.has(uri)) playlistFilters.set(uri, newFilter());
  return playlistFilters.get(uri);
}

const pins = { playlists: new Set(), tracks: new Set() };
// Liked/followed/saved -- real, currently-missing product capabilities
// (spot-tui has no way to like a track, follow an artist, or save an
// album from inside the app at all). Modeled here so the interaction
// gets designed once, even though wiring the real Rust side is its own
// separate roadmap item, not part of this preview.
const liked = new Set(LIKED_SONGS.map(t => t.uri));
const following = new Set(ARTISTS.filter((a, i) => i < 2).map(a => a.uri));
const savedAlbumUris = new Set(ALBUMS.filter((a, i) => i < 2).map(a => a.name));

// Simulates Fetch<T>'s loading/ready/error lifecycle -- real screens are
// backed by a live Web API call with real latency and real failure
// modes; this mockup can't make a network call, but it can still show
// what those states look like, which matters since a 400 mid-screen was
// this project's single most-repeated live bug report.
const fetchState = {};
const visitedOnce = new Set();
function ensureFetched(key) {
  if (visitedOnce.has(key)) { if (!fetchState[key]) fetchState[key] = { status: "ready" }; return; }
  visitedOnce.add(key);
  const forceError = fetchState[key] && fetchState[key].forceError;
  fetchState[key] = { status: "loading" };
  setTimeout(() => {
    fetchState[key] = forceError
      ? { status: "error", error: "HTTP 400 Bad Request: Invalid limit" }
      : { status: "ready" };
    render();
  }, 260);
}
// Debug-only affordance (see the banner) -- re-runs a screen's fetch as
// a forced failure so the error-state design can actually be reviewed
// without needing a real Dev-Mode account to reproduce a 400 on demand.
function forceRefetchAsError(key) {
  visitedOnce.delete(key);
  fetchState[key] = { forceError: true };
  ensureFetched(key);
}

function curScreen() { return stack[stack.length - 1]; }
function push(screen, ctx) { stack.push(Object.assign({screen}, ctx || {})); setSel(0); }
function pop() { if (stack.length > 1) stack.pop(); }
function goto(screen, ctx) {
  const target = Object.assign({screen}, ctx || {});
  // nowplaying always stays at the bottom of the stack, or Esc has
  // nowhere left to pop to -- a version of this that replaced the whole
  // stack made Esc a permanent no-op after any sidebar-triggered nav.
  stack = screen === "nowplaying" ? [target] : [{screen: "nowplaying"}, target];
  setSel(0);
}
function selKey() {
  const f = curScreen();
  const id = f.playlist ? f.playlist.uri : f.artist ? f.artist.uri : f.album ? f.album.name : "";
  return f.screen + ":" + id;
}
function getSel() { return sel[selKey()] || 0; }
function setSel(v) { sel[selKey()] = v; }
function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

/* ---------- rendering ---------- */

function ruleLine() { return `<hr class="rule">`; }

// One shared row shape for every list on every screen (see .row in the
// stylesheet for why) -- marker column, truncating primary label,
// right-aligned dim meta. `cls` adds e.g. "playing"/"pinned"/"moving".
// `heart` is a separate slot from `marker` -- pin/playing/moving and
// liked-status are independent facts about a row and a track can be
// both at once (pinned AND liked), so they need their own columns
// instead of fighting over one glyph the way pin+selection used to.
function row(i, marker, primary, meta, selected, cls, heart) {
  return `<div class="row${selected ? " sel" : ""}${cls ? " " + cls : ""}" data-i="${i}">` +
    `<span class="row-marker">${marker || ""}</span>` +
    `<span class="row-primary">${esc(primary)}</span>` +
    `<span class="row-heart${heart ? " liked" : ""}" data-heart-i="${i}">${heart ? "♥" : ""}</span>` +
    (meta ? `<span class="row-meta">${esc(meta)}</span>` : "") +
    `</div>`;
}
function renderRows(items, i0, labelFn, metaFn, selected, markerFn, clsFn, heartFn) {
  return items.map((it, i) => {
    const idx = i0 + i;
    return row(idx, markerFn ? markerFn(it, idx) : "", labelFn(it), metaFn ? metaFn(it) : "", idx === selected,
      clsFn ? clsFn(it, idx) : "", heartFn ? heartFn(it, idx) : false);
  }).join("");
}

function loadingState() { return `<div class="state-block state-loading">loading…</div>`; }
function errorState(msg, canRetry) {
  return `<div class="state-block"><div class="state-error">failed to load: ${esc(msg)}` +
    (canRetry ? `<div class="retry">press <b>r</b> to retry</div>` : "") + `</div></div>`;
}
function emptyState(headline, hint) {
  return `<div class="state-block state-empty"><div class="headline">${esc(headline)}</div>` +
    (hint ? `<div class="hint">${esc(hint)}</div>` : "") + `</div>`;
}
// Wraps a screen's real content behind its simulated Fetch<T> lifecycle
// -- loading once per visit, then ready, or a forced error via the `!`
// debug key (see forceRefetchAsError). `renderReady` is only called
// once fetchState says the data would actually be there.
function withFetch(key, renderReady) {
  ensureFetched(key);
  const fs = fetchState[key];
  if (fs.status === "loading") return loadingState();
  if (fs.status === "error") return errorState(fs.error, true);
  return renderReady();
}

function filterHeaderHtml(filter, count) {
  if (filter.editing) return `<div class="filter-header">/ <span class="live">${esc(filter.query)}<span class="cursor">&nbsp;</span></span></div>`;
  if (filter.query) return `<div class="filter-header">filter: "<span class="live">${esc(filter.query)}</span>"${filter.sortAlpha ? ", A–Z" : ""} <span class="hint">(${count} shown)</span></div>`;
  if (filter.sortAlpha) return `<div class="filter-header">A–Z sort <span class="hint">-- / to filter</span></div>`;
  return "";
}
// Applies filter.query (case-insensitive substring on labelFn) and,
// if set, an alpha sort -- returns [origIndex, item] pairs so a
// filtered/sorted view never loses track of the real position Spotify
// needs for playback (the exact bug the real app's own filtered_sorted
// was written to avoid).
function filteredSorted(items, filter, labelFn) {
  let out = items.map((it, i) => [i, it]);
  if (filter.query) {
    const q = filter.query.toLowerCase();
    out = out.filter(([, it]) => labelFn(it).toLowerCase().includes(q));
  }
  if (filter.sortAlpha) out = out.slice().sort((a, b) => labelFn(a[1]).localeCompare(labelFn(b[1])));
  return out;
}
function pinnedFirst(pairs, pinSet, uriFn) {
  const pinned = pairs.filter(([, it]) => pinSet.has(uriFn(it)));
  const rest = pairs.filter(([, it]) => !pinSet.has(uriFn(it)));
  return pinned.concat(rest);
}

function hashHue(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return h % 360;
}
// A single solid color, not a gradient -- matches what the real app can
// actually paint: one `Color::Indexed` background per cell, hashed from
// artist+album. A two-color blend has no terminal equivalent (no
// compositing between cells), so showing one here would be promising a
// look this app can never actually ship.
function artStyle(track) {
  const h = hashHue(track.album + track.artist);
  return `background: hsl(${h},50%,28%);`;
}
function monogram(track) {
  return ((track.artist[0] || "") + (track.album[0] || track.title[0] || "")).toUpperCase();
}

// The art block is this screen's one deliberate bold moment (Restraint
// Rule) -- everything else here stays quiet so it reads as the thing to
// look at, not one accent among several competing for attention.
//
// Shows the WHOLE lyric sheet by default (like official Spotify's
// lyrics tab), not a small context window -- the sheet scrolls on its
// own and auto-centers on the current line (see scrollCurrentLyricIntoView,
// called after every render). Fullscreen reflows the same two pieces
// (art+meta, lyrics) from a stacked column into a real side-by-side
// "beautiful lyrics" layout instead of just scaling the stacked version
// up, via the .fs class toggled on the wrapper.
function nowPlayingHero() {
  const tr = nowPlaying.track;
  const icon = nowPlaying.playing ? "▶" : "⏸";
  const filled = Math.round((nowPlaying.pos / nowPlaying.dur) * 40);
  const gauge = `<span class="gauge-fill">${"█".repeat(filled)}</span><span class="gauge-empty">${"░".repeat(40-filled)}</span>`;
  const mm = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
  const curIdx = currentLyricIndex();
  const lyricsHtml = lyricsDemoState === "instrumental" ? `<div class="lyric-line">♪ instrumental</div>`
    : lyricsDemoState === "notfound" ? `<div class="lyric-line">no lyrics found</div>`
    : lyricsDemoState === "plain" ? `<div class="lyric-line" style="margin-bottom:8px">(unsynced)</div>` +
        LYRICS.filter(l => l && !SECTION_LABELS.includes(l)).map(l => `<div class="lyric-line">${esc(l)}</div>`).join("")
    : LYRICS.map((l, i) => {
        if (l === "") return "";
        if (SECTION_LABELS.includes(l)) return `<div class="lyric-section">${esc(l)}</div>`;
        return `<div class="lyric-line${i === curIdx ? " cur" : ""}" data-lyric-i="${i}">${esc(l)}</div>`;
      }).join("");

  const side = `<div class="np-side">
    <div class="art-hero" style="${artStyle(tr)}"><span class="art-mono">${esc(monogram(tr))}</span></div>
    <div class="np-meta">
      <div class="np-title">${esc(tr.title)}<span class="np-heart${liked.has(tr.uri) ? " liked" : ""}"> ♥</span></div>
      <div class="np-artist">${esc(tr.artist)} — ${esc(tr.album)}</div>
      ${nowPlaying.contextLabel ? `<div class="np-context">Playing from ${esc(nowPlaying.contextLabel)}</div>` : ""}
      <div class="np-transport">${icon} ${mm(nowPlaying.pos)} / ${mm(nowPlaying.dur)} &nbsp;&nbsp; vol ${nowPlaying.vol}%</div>
      <div class="gauge-track">${gauge}</div>
    </div>
  </div>`;
  const lyrics = `<div class="lyrics-pane" id="lyricsPane">${lyricsHtml}</div>`;

  return `<div class="now-playing${fullscreen ? " fs" : ""}">${side}${fullscreen ? "" : ruleLine()}${lyrics}</div>`;
}
// Called after every render while Now Playing is showing -- keeps the
// current line roughly centered in its scroll container without
// fighting a user who's manually scrolled elsewhere in the sheet, the
// same "only move the viewport when it actually needs to" idea the real
// app's list screens already use for their own scroll state.
function scrollCurrentLyricIntoView() {
  const el = document.querySelector('[data-lyric-i="' + currentLyricIndex() + '"]');
  if (el) el.scrollIntoView({ block: "center" });
}
// Deliberately not a stripped-down hero -- no art block at all, since
// there's nothing yet to depict art for. Matches the real app's own
// idle/session-ended treatment being designed as its own state, not a
// hero with the numbers zeroed out.
function nowPlayingIdle() {
  return `<div class="np-idle">ready — press <b>/</b> to search, or <b>l</b> for your library…</div>`;
}

// Breadcrumb derived from the real stack, not a hand-picked string per
// screen -- the v1 mockup's hardcoded crumbs only ever worked 2 deep;
// this app legitimately goes 5 deep (NowPlaying→Library→FollowedArtists
// →ArtistDetail→AlbumDetail), and Help can push from any depth.
function crumbLabel(frame) {
  switch (frame.screen) {
    case "nowplaying": return "now playing";
    case "search": return "search";
    case "library": return "library";
    case "likedSongs": return "liked songs";
    case "savedAlbums": return "saved albums";
    case "followedArtists": return "followed artists";
    case "yourPlaylists": return "your playlists";
    case "playlistDetail": return "playlist / " + frame.playlist.name;
    case "artistDetail": return "artist / " + frame.artist.name;
    case "albumDetail": return "album / " + frame.album.name;
    case "queue": return "queue";
    case "devices": return "devices";
    case "help": return "help";
    default: return frame.screen;
  }
}

function renderScreen() {
  const t = curScreen();
  const renderers = {
    nowplaying: renderNowPlaying, search: renderSearch, library: renderLibraryHome,
    likedSongs: renderLikedSongs, savedAlbums: renderSavedAlbums, followedArtists: renderFollowedArtists,
    yourPlaylists: renderYourPlaylists, artistDetail: renderArtistDetail, albumDetail: renderAlbumDetail,
    playlistDetail: renderPlaylistDetail, queue: renderQueue, devices: renderDevices, help: renderHelp,
  };
  const html = (renderers[t.screen] || (() => ""))(t);

  document.getElementById("breadcrumb").textContent = stack.map(crumbLabel).join(" / ");
  document.getElementById("main").innerHTML = html;
  document.getElementById("main").classList.toggle("focused", focus === "main");
  document.getElementById("sidebar").classList.toggle("focused", focus === "sidebar");
  document.getElementById("shell").classList.toggle("fullscreen", fullscreen);
  renderStatusBar();
  renderSidebar();
  renderPlaybar();
  renderOverlay();
  if (t.screen === "nowplaying" && nowPlaying.track) scrollCurrentLyricIntoView();
}

function renderStatusBar() {
  const el = document.getElementById("statusbar");
  el.classList.remove("ok", "err");
  if (moveMode) { el.innerHTML = `MOVE MODE — <b>↑/↓</b> relocate, <b>g</b> jump to position, <b>Enter</b> confirm, <b>Esc</b> cancel`; return; }
  if (fullscreen) { el.innerHTML = `FULLSCREEN — <b>f</b> or <b>Esc</b> to exit`; return; }
  if (status) {
    el.classList.add(status.kind === "err" ? "err" : "ok");
    el.textContent = status.text;
    return;
  }
  el.innerHTML = `stack depth ${stack.length} — <b>Tab</b> switch pane, <b>Esc</b> back, <b>?</b> help`;
}

function screenHeader(title, ...pills) {
  return `<div class="screen-header"><span>${esc(title)}</span>${pills.map(p => `<span class="pill">${p}</span>`).join("")}</div>`;
}

function renderNowPlaying() {
  return nowPlaying.track ? nowPlayingHero() : nowPlayingIdle();
}

// Always-live query line (no separate typing-vs-browsing mode) -- every
// printable char always inserts here, matching the one standing
// exception where q/?/l/c/a/v never reach this screen as commands.
function renderSearch() {
  let html = `<div class="screen-header">/ ${esc(search.query)}<span class="cursor">&nbsp;</span></div>` + ruleLine();
  if (search.error) {
    html += errorState(search.error, false) + `<div class="hint" style="margin-top:8px">press Enter to retry the search</div>`;
  } else if (!search.searched) {
    html += search.query.trim()
      ? emptyState("press Enter to search", `hits the Web API directly -- not a live local filter`)
      : emptyState("type a query, Enter to search", "Ctrl+→ album · Alt+→ artist · Ctrl+↓ add to playlist · Alt+Enter demos a failed search");
  } else if (search.results.length === 0) {
    html += emptyState(`no results for "${search.query}"`, "try a different query, or check the spelling");
  } else {
    html += renderRows(search.results, 0, r => r.title, r => `${r.artist} · ${r.album}`, getSel(), null, null, r => liked.has(r.uri));
  }
  return html;
}

function renderLibraryHome() {
  const entries = [["Liked Songs", "likedSongs"], ["Saved Albums", "savedAlbums"], ["Followed Artists", "followedArtists"], ["Your Playlists", "yourPlaylists"]];
  return screenHeader("Library") + ruleLine() + renderRows(entries, 0, e => e[0], null, getSel());
}

function renderLikedSongs() {
  return withFetch("likedSongs", () => {
    if (LIKED_SONGS.length === 0) return screenHeader("Liked Songs") + ruleLine() + emptyState("no liked songs yet", "press Shift+L on any track to like it");
    const filter = filters.likedSongs;
    const pairs = filteredSorted(LIKED_SONGS, filter, tr => tr.artist + " " + tr.title);
    let html = screenHeader("Liked Songs", `${LIKED_SONGS.length} songs`) + ruleLine() + filterHeaderHtml(filter, pairs.length);
    if (pairs.length === 0) return html + emptyState(`no matches for "${filter.query}"`);
    html += renderRows(pairs.map(([, tr]) => tr), 0, tr => tr.title, tr => tr.artist, getSel(), null, null, tr => liked.has(tr.uri));
    return html;
  });
}

function renderSavedAlbums() {
  return withFetch("savedAlbums", () => {
    if (ALBUMS.length === 0) return screenHeader("Saved Albums") + ruleLine() + emptyState("no saved albums yet", "save albums from the Spotify app for now");
    const filter = filters.savedAlbums;
    const pairs = filteredSorted(ALBUMS, filter, a => a.name + " " + a.artist);
    let html = screenHeader("Saved Albums") + ruleLine() + filterHeaderHtml(filter, pairs.length);
    if (pairs.length === 0) return html + emptyState(`no matches for "${filter.query}"`);
    html += renderRows(pairs.map(([, a]) => a), 0, a => a.name, a => a.artist, getSel());
    return html;
  });
}

function renderFollowedArtists() {
  return withFetch("followedArtists", () => {
    if (ARTISTS.length === 0) return screenHeader("Followed Artists") + ruleLine() + emptyState("not following anyone yet", "follow artists from the Spotify app for now");
    const filter = filters.followedArtists;
    const pairs = filteredSorted(ARTISTS, filter, a => a.name);
    let html = screenHeader("Followed Artists") + ruleLine() + filterHeaderHtml(filter, pairs.length);
    if (pairs.length === 0) return html + emptyState(`no matches for "${filter.query}"`);
    html += renderRows(pairs.map(([, a]) => a), 0, a => a.name, a => a.genres.join(", "), getSel());
    return html;
  });
}

function renderYourPlaylists() {
  return withFetch("yourPlaylists", () => {
    if (PLAYLISTS.length === 0) return screenHeader("Your Playlists") + ruleLine() + emptyState("no playlists yet", "press c to create one");
    const filter = filters.yourPlaylists;
    const pairs = pinnedFirst(filteredSorted(PLAYLISTS, filter, p => p.name), pins.playlists, p => p.uri);
    // No keybind legend here -- Help already owns that, and repeating
    // c/r/d/Shift+P as pills on every visit competed with the actual
    // list for attention. A count is real info Help can't give you.
    let html = screenHeader("Your Playlists", `${PLAYLISTS.length} playlists`) + ruleLine() + filterHeaderHtml(filter, pairs.length);
    if (pairs.length === 0) return html + emptyState(`no matches for "${filter.query}"`);
    html += renderRows(pairs.map(([, p]) => p), 0, p => p.name, p => `${p.tracks.length} tracks`, getSel(),
      (p) => pins.playlists.has(p.uri) ? "★" : "", (p) => pins.playlists.has(p.uri) ? "pinned" : "");
    return html;
  });
}

// No top-tracks section, no follow toggle -- see the ARTISTS comment:
// Spotify removed the top-tracks endpoint outright, and follow/unfollow
// is real but explicitly deferred past this phase's read-only scope.
// Follow/unfollow is a real, currently-deferred product capability (see
// the ARTISTS comment) -- modeled here since it's the same one-key
// affordance real Spotify has, even though wiring the real Rust side
// (library_add/library_remove with LibraryId::Artist) is its own
// separate roadmap item.
function renderArtistDetail(t) {
  const a = t.artist;
  return withFetch("artistDetail:" + a.uri, () => {
    const followState = following.has(a.uri) ? "following (Shift+F to unfollow)" : "not following (Shift+F to follow)";
    let html = screenHeader(a.name, esc(a.genres.join(", ")), followState) + ruleLine();
    if (a.albums.length === 0) return html + emptyState("no albums found for this artist");
    html += renderRows(a.albums, 0, name => name, null, getSel());
    return html;
  });
}

function renderAlbumDetail(t) {
  const al = t.album;
  return withFetch("albumDetail:" + al.name, () => {
    const saveState = savedAlbumUris.has(al.name) ? "saved (Shift+S to remove)" : "not saved (Shift+S to save)";
    const html = screenHeader(al.name, `— ${esc(al.artist)}`, `${al.tracks.length} tracks`, saveState) + ruleLine();
    return html + renderRows(al.tracks, 0, tr => tr.title, tr => tr.dur, getSel(), null, null, tr => liked.has(tr.uri));
  });
}

// The one screen with a real gate before you can even reach it (`m`) --
// eligibility depends on filter/sort state, checked live rather than
// just disabling the key silently.
function moveIneligibleReason(p, filter) {
  if (filter.editing || filter.query || filter.sortAlpha) return "clear the filter and turn off sort to reorder";
  if (p.tracks.length < 2) return null; // nothing to reorder, but not an error -- `m` just does nothing
  return "";
}

function renderPlaylistDetail(t) {
  const p = t.playlist;
  return withFetch("playlistDetail:" + p.uri, () => {
    const filter = playlistFilter(p.uri);
    if (moveMode) {
      let html = screenHeader(p.name, `<span class="warn">MOVE MODE</span>`) + ruleLine();
      html += renderRows(p.tracks, 0, tr => tr.title, tr => tr.artist, getSel(),
        (tr, i) => i === moveMode.index ? "→" : "", (tr, i) => i === moveMode.index ? "moving" : "");
      return html;
    }
    let html = screenHeader(p.name, `${p.tracks.length} tracks`) + ruleLine();
    html += filterHeaderHtml(filter, p.tracks.length);
    if (p.tracks.length === 0) {
      return html + emptyState("this playlist is empty", "press a from Search, Liked Songs, Now Playing, Queue, or Album Detail to add a track here");
    }
    const pairs = pinnedFirst(filteredSorted(p.tracks, filter, tr => tr.artist + " " + tr.title), pins.tracks, tr => tr.uri);
    if (pairs.length === 0) return html + emptyState(`no matches for "${filter.query}"`);
    html += renderRows(pairs.map(([, tr]) => tr), 0, tr => tr.title, tr => tr.artist, getSel(),
      (tr) => pins.tracks.has(tr.uri) ? "★" : "", (tr) => pins.tracks.has(tr.uri) ? "pinned" : "", (tr) => liked.has(tr.uri));
    return html;
  });
}

// No `d`, no `m` -- the public Web API has no remove or reorder
// endpoint for the queue at all (confirmed by reading rspotify's full
// method list before building anything here), matching what the
// official Spotify app can do with its own queue too. Not a corner cut.
function renderQueue() {
  return withFetch("queue", () => {
    let html = screenHeader("Queue") + ruleLine();
    const current = QUEUE[queueIndex];
    html += `<div class="dim" style="margin-bottom:8px">now playing: ${current ? esc(current.artist + " — " + current.title) : "(nothing)"}</div>`;
    if (QUEUE.length === 0) return html + emptyState("queue is empty");
    html += renderRows(QUEUE, 0, tr => tr.title, tr => tr.artist, getSel(),
      (tr, i) => i === queueIndex ? "▶" : "", (tr, i) => i === queueIndex ? "playing" : "", (tr) => liked.has(tr.uri));
    html += `<div class="hint" style="margin-top:8px">refreshes automatically every 5s while this screen is open -- no remove/reorder: the Web API doesn't expose either for the queue</div>`;
    return html;
  });
}

function renderDevices() {
  return withFetch("devices", () => {
    let html = screenHeader("Devices", `${DEVICES.length} devices`) + ruleLine();
    if (DEVICES.length === 0) return html + emptyState("no devices found", "open Spotify on another device, or press r to check again");
    html += renderRows(DEVICES, 0, d => d.name, d => `${d.kind} · ${d.vol}%`, getSel(),
      (d) => d.active ? "●" : "", (d) => d.active ? "playing" : "");
    return html;
  });
}

// Verbatim-in-spirit, not byte-for-byte, the real app's own

    ["Space / n / p", "play-pause / next / previous -- every screen except Search"],

    ["↑ / ↓", "move selection"], ["Enter / →", "open"],
    ["Shift+P", "pin / unpin a playlist row"], ["Esc", "no-op -- already at the root"],
  ]],
  ["Library lists", [

  ["Artist Detail", [["↑ / ↓", "move selection among albums"], ["Enter / →", "open the album"], ["Shift+F", "follow / unfollow"], ["--", "no top tracks -- Spotify removed that endpoint"]]],
